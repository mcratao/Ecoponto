<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Ecoponto</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 18px;background:#f6f8f6;color:#17302a}
    h1{margin-bottom:4px}.box{background:#fff;border:1px solid #dce7e1;border-radius:12px;padding:16px;margin:14px 0}
    .ok{color:#197a43}.erro{color:#b3261e}.warn{color:#8a5a00}
    pre{white-space:pre-wrap;word-break:break-word;background:#f2f4f3;padding:12px;border-radius:8px}
    button{padding:10px 16px;border:0;border-radius:8px;background:#2d7d5b;color:#fff;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <h1>Diagnóstico do Ecoponto</h1>
  <p>Esta página testa a conexão do GitHub Pages com o Supabase.</p>
  <button onclick="rodar()">Executar testes</button>
  <div id="resultado"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const out = document.getElementById('resultado');

    function bloco(titulo, status, texto) {
      const cls = status === 'OK' ? 'ok' : status === 'ERRO' ? 'erro' : 'warn';
      out.innerHTML += `<div class="box"><h3>${titulo}: <span class="${cls}">${status}</span></h3><pre>${texto}</pre></div>`;
    }

    async function rodar() {
      out.innerHTML = '';

      if (!window.supabase) {
        bloco('1. Biblioteca Supabase', 'ERRO', 'A biblioteca Supabase não carregou. Verifique conexão com a internet ou bloqueio ao cdn.jsdelivr.net.');
        return;
      }
      bloco('1. Biblioteca Supabase', 'OK', 'SDK carregado.');

      if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
        bloco('2. Configuração', 'ERRO', 'Não foi possível ler js/config.js.');
        return;
      }

      const urlOk = /^https:\/\/[a-z0-9]+\.supabase\.co$/i.test(SUPABASE_URL);
      const keyOk = SUPABASE_ANON_KEY.startsWith('sb_publishable_') || SUPABASE_ANON_KEY.startsWith('eyJ');
      bloco('2. Configuração', (urlOk && keyOk) ? 'OK' : 'ATENÇÃO',
        `URL: ${SUPABASE_URL}\nChave pública detectada: ${keyOk ? 'sim' : 'não'}\nTamanho da chave: ${SUPABASE_ANON_KEY.length} caracteres`);

      let client;
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        bloco('3. Cliente Supabase', 'OK', 'Cliente criado.');
      } catch (e) {
        bloco('3. Cliente Supabase', 'ERRO', e.message || String(e));
        return;
      }

      try {
        const { data, error, count } = await client
          .from('collection_points')
          .select('*', { count: 'exact' });

        if (error) {
          bloco('4. Tabela collection_points', 'ERRO',
            `Código: ${error.code || '-'}\nMensagem: ${error.message}\nDetalhes: ${error.details || '-'}\nHint: ${error.hint || '-'}`);
        } else {
          bloco('4. Tabela collection_points', 'OK',
            `Registros encontrados: ${count ?? data.length}\n\n${JSON.stringify(data, null, 2)}`);
        }
      } catch (e) {
        bloco('4. Tabela collection_points', 'ERRO', e.message || String(e));
      }

      try {
        const { data, error, count } = await client
          .from('recycling_events')
          .select('*', { count: 'exact' });

        if (error) {
          bloco('5. Tabela recycling_events', 'ERRO',
            `Código: ${error.code || '-'}\nMensagem: ${error.message}\nDetalhes: ${error.details || '-'}\nHint: ${error.hint || '-'}`);
        } else {
          bloco('5. Tabela recycling_events', 'OK',
            `Registros encontrados: ${count ?? data.length}\n\n${JSON.stringify(data, null, 2)}`);
        }
      } catch (e) {
        bloco('5. Tabela recycling_events', 'ERRO', e.message || String(e));
      }
    }

    rodar();
  </script>
</body>
</html>
